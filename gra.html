<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b100d">
  <meta name="robots" content="noindex">
  <title>Huntly — gra terenowa</title>
  <style>
    :root { color-scheme: dark; background: #0b100d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b100d; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #0b100d; }
    #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; background: #0b100d; color: #eef4e8; transition: opacity .25s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    .spinner { width: 36px; height: 36px; margin: 0 auto; border: 3px solid #c7f36b30; border-top-color: #c7f36b; border-radius: 50%; animation: spin .8s linear infinite; }
    p { margin: 0; color: #9aa99c; font-size: 14px; }
    a { color: #c7f36b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Uruchamiamy Huntly…</strong>
    <p>Ładowanie gry terenowej.</p>
    <p>Jeśli gra nie otworzy się automatycznie, <a href="https://huntly-game.web.app/" target="_blank" rel="noopener noreferrer">otwórz ją bezpośrednio</a>.</p>
  </div>
  <iframe
    id="game"
    src="https://huntly-game.web.app/"
    title="Huntly — gra terenowa"
    allow="geolocation *; fullscreen *; clipboard-read *; clipboard-write *"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    (function () {
      var frame = document.getElementById('game');
      var loading = document.getElementById('loading');
      var timer = setTimeout(function () {
        loading.classList.add('done');
      }, 10000);
      frame.addEventListener('load', function () {
        clearTimeout(timer);
        loading.classList.add('done');
      });
    })();
  </script>
</body>
</html>
