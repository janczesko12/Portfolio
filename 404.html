<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>404 — Mythoria</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#08090d;--panel:rgba(17,20,28,.78);--line:rgba(255,255,255,.1);--text:#f3f5f7;--muted:#9da4b3;--accent:#b7ff4a;--accent2:#d7ff91}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:18px;overflow-x:hidden}
    .wrap{width:min(1180px,100%);min-height:calc(100vh - 36px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.008));overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.42);position:relative}
    .top{position:absolute;left:18px;right:18px;top:16px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(8,9,13,.68);backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;font-size:.78rem}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#0b0d0a;display:grid;place-items:center;font-weight:950;letter-spacing:0}
    .nav{display:flex;gap:24px;color:var(--muted);font-size:.88rem}.nav a{text-decoration:none;color:inherit}.nav a:hover{color:var(--text)}
    .content{position:relative;z-index:2;min-height:calc(100vh - 36px);display:grid;grid-template-columns:1.03fr .97fr;gap:10px;align-items:center;padding:110px 52px 52px}
    .copy{padding:16px 14px 16px 8px}.kicker{font:800 .72rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
    h1{font-size:clamp(4.4rem,10vw,8.4rem);line-height:.85;letter-spacing:-.07em;margin:18px 0 16px}.copy h2{font-size:clamp(1.9rem,4vw,3.2rem);line-height:1;letter-spacing:-.05em;margin:0 0 18px}
    .copy p{color:var(--muted);font-size:1.02rem;max-width:560px;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .btn{min-height:48px;padding:0 18px;border-radius:13px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none}.primary{background:var(--accent);color:#0a0d06;border-color:var(--accent)}.ghost{color:var(--text);background:rgba(255,255,255,.025)}
    .art{display:grid;place-items:center}.art img{width:100%;max-width:650px;border-radius:20px;border:1px solid rgba(183,255,74,.16);box-shadow:0 30px 80px rgba(0,0,0,.42)}
    .hint{margin-top:22px;color:#697282;font:600 .72rem/1.5 ui-monospace,Menlo,monospace}.hint b{color:#b7ff4a}
    @media(max-width:800px){.top{left:10px;right:10px;top:10px}.nav{display:none}.content{grid-template-columns:1fr;padding:105px 24px 30px;min-height:calc(100vh - 36px)}.copy{padding:0}.copy p{font-size:.94rem}.art{order:-1}.art img{max-width:560px}.actions .btn{flex:1 1 160px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="brand" href="/"><span class="mark">M</span>MYTHORIA</a>
      <nav class="nav"><a href="/#about">O mnie</a><a href="/#projects">Projekty</a><a href="/#stack">Stack</a><a href="/#contact">Kontakt</a></nav>
    </header>
    <section class="content">
      <div class="copy">
        <div class="kicker">ERROR / 404</div>
        <h1>404</h1>
        <h2>Strona zaginęła w kodzie.</h2>
        <p>Wygląda na to, że ten adres nie prowadzi już nigdzie. Spokojnie — projekty nadal działają.</p>
        <div class="actions"><a class="btn primary" href="/">Wróć na stronę główną ↗</a><a class="btn ghost" href="/#projects">Zobacz projekty</a></div>
        <div class="hint">system: <b>online</b> · route: <b>not_found</b> · suggestion: <b>go_home()</b></div>
      </div>
      <div class="art"><img src="/404-mythoria.svg" alt="Neonowa ilustracja strony 404 Mythoria"></div>
    </section>
  </main>
</body>
</html>
