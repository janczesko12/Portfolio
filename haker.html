<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Command Prompt</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#c8ffc8}
    body{font:16px/1.45 "Courier New",Courier,monospace;padding:16px;box-sizing:border-box}
    #terminal{white-space:pre-wrap;overflow-wrap:anywhere}
    #entry-line{display:flex;gap:8px;align-items:baseline}
    #prompt{flex:0 0 auto}
    #command{flex:1;min-width:0;background:transparent;color:#c8ffc8;border:0;outline:0;font:inherit;padding:0;caret-color:#c8ffc8}
    #command::selection{background:#c8ffc8;color:#000}
    .system{color:#c8ffc8}.warning{color:#fff}.success{color:#aaffaa}
    .prank{color:#fff;font-weight:bold}
    #rickroll-player{margin:18px 0;max-width:100%}
    #rickroll-player iframe{display:block;width:min(560px,100%);aspect-ratio:16/9;height:auto}
    @media(max-width:480px){body{font-size:14px;padding:10px}}
  </style>
</head>
<body>
  <main aria-label="Symulowany wiersz polecenia">
    <div id="terminal" role="log" aria-live="polite"></div>
    <div id="rickroll-player" hidden></div>
    <form id="entry-line" autocomplete="off">
      <label id="prompt" for="command">Login:</label>
      <input id="command" name="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </form>
  </main>
  <script src="/haker.js" defer></script>
</body>
</html>
