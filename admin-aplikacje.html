<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b10">
  <title>Panel aplikacji — NovyDev</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/applications.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Strona główna NovyDev"><span class="brand-mark" aria-hidden="true">N</span><span>NOVYDEV</span></a>
    <nav class="nav admin-nav"><a href="/aplikacje">Podgląd aplikacji</a><a href="/">Portfolio</a></nav>
  </header>
  <main class="admin-page section-pad">
    <div class="admin-top"><div><p class="kicker">NOVYDEV / ADMIN</p><h1>Panel <em>aplikacji</em></h1><p class="admin-subtitle">Zarządzaj katalogiem aplikacji. Zmiany publiczne pojawią się na stronie Aplikacje.</p></div><div id="auth-area"><button id="login-button" class="btn btn-primary" type="button">Zaloguj się kontem Google</button></div></div>
    <div id="admin-message" class="admin-message" role="status">Zaloguj się kontem administratora, aby zarządzać aplikacjami.</div>
    <section id="admin-workspace" hidden>
      <div class="admin-toolbar"><h2>Twoje aplikacje</h2><button id="new-app" class="btn btn-primary" type="button">+ Dodaj aplikację</button></div>
      <div id="admin-list" class="admin-list"></div>
      <form id="app-form" class="admin-form" hidden>
        <input id="app-id" type="hidden">
        <div class="admin-form-heading"><h2 id="form-heading">Nowa aplikacja</h2><button id="cancel-edit" class="btn btn-ghost" type="button">Anuluj</button></div>
        <div class="admin-fields">
          <label>Nazwa aplikacji<input id="app-name" maxlength="80" required placeholder="np. KinoStream"></label>
          <label>Platforma<input id="app-platform" maxlength="40" placeholder="np. Android"></label>
          <label>Wersja<input id="app-version" maxlength="30" placeholder="np. 1.0"></label>
          <label>Kolejność sortowania<input id="app-order" type="number" step="1" value="100" required></label>
          <label class="wide">Opis<textarea id="app-description" maxlength="1200" rows="4" required placeholder="Krótki opis aplikacji…"></textarea></label>
          <label class="wide">Adres ikony / zdjęcia (URL)<input id="app-image" type="url" placeholder="https://…"><small>Wklej bezpośredni adres HTTPS do ikony lub grafiki.</small></label>
          <label class="wide">Link pobierania<input id="app-download" type="url" placeholder="https://…"></label>
          <label class="wide">Link do strony aplikacji (opcjonalnie)<input id="app-website" type="url" placeholder="https://…"></label>
          <label>Tekst przycisku<input id="app-button" maxlength="40" value="Pobierz aplikację"></label>
          <label class="check-field"><input id="app-published" type="checkbox" checked> Opublikowana publicznie</label>
        </div>
        <div id="image-preview" class="admin-image-preview">Podgląd ikony</div>
        <div class="admin-form-actions"><button class="btn btn-primary" type="submit">Zapisz aplikację</button><button id="delete-app" class="btn btn-danger" type="button" hidden>Usuń aplikację</button></div>
      </form>
    </section>
  </main>
  <script type="module" src="/admin-aplikacje.js"></script>
</body>
</html>
